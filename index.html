<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trainual Agent Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

  <style>
    :root {
      --purple: #6A28EA;
      --purple-hover: #7B3FF5;
      --purple-dark: #5a1fd4;
      --purple-glow: rgba(106,40,234,0.2);
      --purple-soft: rgba(106,40,234,0.07);
      --purple-muted: rgba(106,40,234,0.12);
      --eggplant: #020044;
      --eggplant-card: #0a0a50;
      --eggplant-card-hover: #10105a;
      --eggplant-border: rgba(106,40,234,0.12);
      --eggplant-border-hover: rgba(106,40,234,0.3);
      --eggplant-text: rgba(255,255,255,0.5);
      --eggplant-text-bright: rgba(255,255,255,0.88);
      --oatmeal: #F4F1EA;
      --white: #FFFFFF;
      --green: #06D4AE;
      --highlight: #FFF384;
      --blue: #5EB7D8;
      --pink: #F445B6;
      --text-bright: rgba(255,255,255,0.92);
      --text-mid: rgba(255,255,255,0.6);
      --text-dim: rgba(255,255,255,0.35);
      --bg: #F8F7F4;
      --border: #E8E5DD;
      --border-light: #EFECE6;
      --text: #020044;
      --text-secondary: #6E6B85;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--eggplant);
      color: var(--text-bright);
      height: 100vh;
      overflow: hidden;
    }

    /* ════════════════════════════════
       VIEW SWITCHING
       ════════════════════════════════ */
    #hubView {
      position: absolute; inset: 0;
    }

    /* Chat overlay */
    .chat-overlay {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .chat-overlay.open {
      opacity: 1; pointer-events: auto;
    }

    .chat-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
    }

    /* Browser window chrome */
    .browser-window {
      position: relative; z-index: 1;
      width: 92vw; max-width: 1080px;
      height: 85vh; max-height: 800px;
      background: #f5f5f5;
      border-radius: 12px;
      box-shadow:
        0 24px 80px rgba(0,0,0,0.35),
        0 4px 20px rgba(0,0,0,0.2),
        0 0 0 1px rgba(0,0,0,0.08);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: scale(0.94) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .chat-overlay.open .browser-window {
      transform: scale(1) translateY(0);
    }

    .browser-toolbar {
      display: flex; align-items: center;
      padding: 12px 16px;
      background: #e8e8e8;
      border-bottom: 1px solid #d0d0d0;
      gap: 12px; flex-shrink: 0;
    }

    .browser-dots {
      display: flex; gap: 7px; flex-shrink: 0;
    }

    .browser-dot {
      width: 12px; height: 12px; border-radius: 50%;
      cursor: pointer; transition: filter 0.15s ease;
      border: none;
    }

    .browser-dot:hover { filter: brightness(0.85); }
    .browser-dot.red { background: #FF5F57; }
    .browser-dot.yellow { background: #FEBC2E; }
    .browser-dot.green { background: #28C840; }

    .browser-url {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: #fff; border: 1px solid #d0d0d0;
      border-radius: 6px; padding: 6px 12px;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      color: #666; overflow: hidden;
    }

    .browser-url-lock { font-size: 11px; color: #4a4; flex-shrink: 0; }
    .browser-url-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .browser-body {
      flex: 1; display: flex; overflow: hidden;
    }

    /* ════════════════════════════════
       HUB VIEW — Pixel Workroom
       ════════════════════════════════ */
    #hubView {
      background: #d4c8a8;
      overflow-y: auto;
      image-rendering: auto;
    }

    /* Subtle paper/wall texture */
    #hubView::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='6' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' x='0' y='0' fill='%23c8bc9a' opacity='0.3'/%3E%3Crect width='1' height='1' x='3' y='2' fill='%23b8ac8a' opacity='0.2'/%3E%3Crect width='1' height='1' x='1' y='4' fill='%23c0b498' opacity='0.25'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    #hubView::-webkit-scrollbar { width: 8px; }
    #hubView::-webkit-scrollbar-track { background: #c4b898; }
    #hubView::-webkit-scrollbar-thumb { background: #a09070; border-radius: 4px; }

    .room-scene {
      position: relative; z-index: 1;
      max-width: 1280px; margin: 0 auto;
      padding: 32px 32px 0;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ── Title Banner ── */
    .room-banner {
      text-align: center; margin-bottom: 28px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .banner-frame {
      display: inline-block;
      background: #2a2a42;
      border: 3px solid #4a4a62;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.08),
        0 4px 0 #1a1a2f,
        0 6px 12px rgba(0,0,0,0.2);
      padding: 14px 40px;
      border-radius: 4px;
    }

    .banner-frame h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px; color: #e8e0d0;
      text-shadow: 0 2px 0 #1a1a2f;
      letter-spacing: 1px;
    }

    .room-subtitle {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px; color: #8a7e6a; margin-top: 14px;
      letter-spacing: 0.5px;
    }

    /* ── Room body ── */
    .room-body {
      display: flex; flex: 1;
      position: relative;
    }

    /* ── Side Navigation ── */
    .side-nav {
      width: 110px; flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center;
      gap: 20px; padding-top: 20px;
    }

    .side-nav.right { align-items: center; }

    .side-link {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; cursor: pointer; text-decoration: none;
      transition: transform 0.15s ease;
    }

    .side-link:hover { transform: scale(1.08); }

    .side-icon {
      width: 42px; height: 42px;
      background: rgba(0,0,0,0.03);
      border: 2px solid rgba(0,0,0,0.06);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.06);
      transition: all 0.15s ease;
    }

    .side-link:hover .side-icon {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.1);
      box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    }

    .side-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px; color: #6a5e4a;
      text-align: center; line-height: 1.4;
      max-width: 70px;
    }

    /* ── Desk Area ── */
    .desk-area {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 0;
    }

    .desk-row {
      display: flex; justify-content: center;
      gap: 24px;
    }

    .desk-row.back { transform: scale(0.92); margin-bottom: -4px; }
    .desk-row.front { transform: scale(1); }

    /* ── Individual Desk Unit ── */
    .desk-unit {
      display: flex; flex-direction: column;
      align-items: center; cursor: pointer;
      transition: transform 0.2s ease;
      animation: fadeUp 0.5s ease both;
      position: relative;
    }

    .desk-unit:hover { transform: translateY(-6px); }
    .desk-unit:hover .pixel-char { animation: bounce 0.4s ease; }

    .desk-unit.offline { cursor: default; opacity: 0.45; filter: grayscale(0.3); }
    .desk-unit.offline:hover { transform: none; }
    .desk-unit.offline:hover .pixel-char { animation: none; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    /* Character */
    .pixel-char {
      width: 64px; height: 72px;
      position: relative; z-index: 2;
      margin-bottom: -12px;
    }

    .pixel-char svg {
      width: 100%; height: 100%;
      image-rendering: auto;
    }

    /* Chair */
    .chair {
      width: 60px; height: 44px;
      background: #3a3a52;
      border: 2px solid #2a2a3f;
      border-radius: 6px 6px 2px 2px;
      position: relative; z-index: 1;
      margin-bottom: -16px;
      box-shadow: 0 2px 0 #222238;
    }

    /* Desk surface */
    .desk-table {
      width: 120px; height: 18px;
      background: linear-gradient(180deg, #b09870, #9a8660);
      border: 2px solid #7a6a4a;
      border-radius: 3px;
      position: relative; z-index: 3;
      box-shadow: 0 3px 0 #6a5a3a;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }

    /* Laptop on desk */
    .laptop-screen {
      width: 24px; height: 14px;
      background: #1a2a3a;
      border: 1.5px solid #3a4a5a;
      border-radius: 2px;
      position: relative;
      box-shadow: inset 0 0 6px rgba(80,180,255,0.15);
    }

    .laptop-screen::after {
      content: ''; position: absolute;
      top: 3px; left: 3px; right: 3px; bottom: 3px;
      background: linear-gradient(135deg, rgba(80,180,255,0.2), rgba(80,255,180,0.1));
      border-radius: 1px;
    }

    .laptop-keys {
      width: 28px; height: 4px;
      background: #4a4a5a;
      border-radius: 1px;
      border: 1px solid #3a3a4a;
    }

    /* Desk legs */
    .desk-legs {
      display: flex; justify-content: space-between;
      width: 110px; height: 20px;
    }

    .desk-leg {
      width: 6px; height: 20px;
      background: linear-gradient(180deg, #7a6a4a, #6a5a3a);
      border-radius: 0 0 2px 2px;
    }

    /* Agent name */
    .desk-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      margin-top: 4px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
    }

    .desk-role {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px; color: #6a5e4a;
      margin-top: 2px; font-weight: 500;
    }

    .desk-status {
      font-family: 'Press Start 2P', monospace;
      font-size: 5px; margin-top: 4px;
      padding: 3px 8px; border-radius: 3px;
    }

    .desk-status.online {
      color: #2a8a5a; background: rgba(42,138,90,0.1);
      border: 1px solid rgba(42,138,90,0.2);
    }

    .desk-status.away {
      color: #8a7a5a; background: rgba(138,122,90,0.1);
      border: 1px solid rgba(138,122,90,0.15);
    }

    /* ── Decorations ── */
    .room-decor {
      display: flex; justify-content: center;
      gap: 160px; margin-top: -4px; margin-bottom: 8px;
      position: relative; z-index: 1;
    }

    .plant-pot {
      width: 40px; text-align: center;
      font-size: 32px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
    }

    .coffee-table {
      width: 80px; height: 12px;
      background: linear-gradient(180deg, #c0a878, #a89060);
      border: 2px solid #8a7a5a;
      border-radius: 3px;
      margin: 0 auto;
      box-shadow: 0 2px 0 #7a6a4a;
    }

    .coffee-table-legs {
      display: flex; justify-content: space-between;
      width: 70px; margin: 0 auto;
    }

    .coffee-table-leg {
      width: 4px; height: 10px;
      background: #8a7a5a;
      border-radius: 0 0 1px 1px;
    }

    /* ── Coffee Bar ── */
    .coffee-bar {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 16px; margin: 8px 0 4px; animation: fadeUp 0.5s ease 0.2s both;
    }

    .coffee-machine {
      width: 40px; height: 48px;
      background: linear-gradient(180deg, #4a4a5a, #3a3a4a);
      border: 2px solid #2a2a3a;
      border-radius: 4px 4px 2px 2px;
      position: relative;
      box-shadow: 0 3px 0 #1a1a2a;
    }

    .coffee-machine::before {
      content: ''; position: absolute;
      top: 8px; left: 8px; right: 8px; height: 12px;
      background: #1a1a2a; border-radius: 2px;
      box-shadow: inset 0 0 4px rgba(234,120,60,0.3);
    }

    .coffee-machine::after {
      content: ''; position: absolute;
      bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 4px; background: #ea784a;
      border-radius: 50%; box-shadow: 0 0 6px rgba(234,120,60,0.5);
    }

    .coffee-counter {
      width: 180px; height: 14px;
      background: linear-gradient(180deg, #8a7a5a, #7a6a4a);
      border: 2px solid #6a5a3a;
      border-radius: 3px;
      box-shadow: 0 3px 0 #5a4a2a;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      position: relative;
    }

    .coffee-cup {
      width: 10px; height: 8px;
      background: #e8e0d0;
      border: 1.5px solid #c0b090;
      border-radius: 0 0 2px 2px;
      position: relative; top: -6px;
    }

    .coffee-cup::after {
      content: '~'; position: absolute;
      top: -8px; left: 1px;
      font-size: 8px; color: rgba(180,160,120,0.6);
    }

    .coffee-counter-legs {
      display: flex; justify-content: space-between;
      width: 170px; margin: 0 auto;
    }

    .coffee-counter-leg {
      width: 5px; height: 14px;
      background: #6a5a3a;
      border-radius: 0 0 2px 2px;
    }

    .coffee-plant {
      font-size: 22px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
    }

    .coffee-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px; color: #8a7e6a;
      text-align: center; margin-top: 2px;
    }

    /* ── Checkered Floor ── */
    .room-floor {
      height: 120px;
      background: repeating-conic-gradient(#3a3a4f 0% 25%, #2e2e42 0% 50%) 0 0 / 48px 48px;
      position: relative;
      margin-top: auto;
      border-top: 4px solid #4a4a5f;
    }

    .room-floor::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15), transparent 40%, rgba(0,0,0,0.1));
      pointer-events: none;
    }

    /* Floor decorations */
    .floor-plants {
      display: flex; justify-content: space-between;
      padding: 16px 40px 0;
      position: relative; z-index: 1;
    }

    .floor-plant { font-size: 36px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }

    /* ── Bookshelf ── */
    .bookshelf {
      width: 80px; margin-top: 16px;
      animation: fadeUp 0.5s ease 0.3s both;
    }

    .bookshelf-top {
      width: 80px; height: 6px;
      background: linear-gradient(180deg, #7a6a4a, #6a5a3a);
      border: 1.5px solid #5a4a2a;
      border-radius: 2px 2px 0 0;
    }

    .shelf-row {
      width: 80px; height: 30px;
      background: #8a7a5a;
      border-left: 2px solid #6a5a3a;
      border-right: 2px solid #6a5a3a;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 2px; padding: 0 4px;
    }

    .shelf-divider {
      width: 80px; height: 4px;
      background: linear-gradient(180deg, #7a6a4a, #6a5a3a);
      border-left: 2px solid #5a4a2a;
      border-right: 2px solid #5a4a2a;
    }

    .book { width: 8px; border-radius: 1px 1px 0 0; box-shadow: 1px 0 0 rgba(0,0,0,0.1); }

    .furniture-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 5px; color: #8a7e6a; text-align: center; margin-top: 5px;
    }

    /* ── Filing Cabinet ── */
    .filing-cabinet {
      width: 50px; margin-top: 12px;
      animation: fadeUp 0.5s ease 0.4s both;
    }

    .cabinet-body {
      width: 50px;
      background: #7a7a8a;
      border: 2px solid #5a5a6a;
      border-radius: 2px;
      box-shadow: 0 3px 0 #4a4a5a;
    }

    .cabinet-drawer {
      height: 20px;
      border-bottom: 1.5px solid #5a5a6a;
      display: flex; align-items: center; justify-content: center;
    }

    .cabinet-drawer:last-child { border-bottom: none; }

    .cabinet-handle {
      width: 14px; height: 3px;
      background: #9a9aaa; border-radius: 1px;
      border: 1px solid #6a6a7a;
    }

    /* ── Water Cooler ── */
    .water-cooler {
      width: 44px; margin-top: 16px;
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp 0.5s ease 0.35s both;
    }

    .cooler-jug {
      width: 26px; height: 26px;
      background: linear-gradient(180deg, rgba(150,200,240,0.35), rgba(100,170,230,0.55));
      border: 2px solid rgba(80,150,210,0.45);
      border-radius: 6px 6px 2px 2px;
      position: relative;
    }

    .cooler-jug::after {
      content: ''; position: absolute;
      top: 3px; left: 3px; width: 5px; height: 8px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
    }

    .cooler-body {
      width: 32px; height: 28px;
      background: #e8e0d0;
      border: 2px solid #c0b090;
      border-radius: 2px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
    }

    .cooler-tap { width: 8px; height: 4px; border-radius: 0 0 2px 2px; }
    .cooler-tap.hot { background: #ea6a4a; }
    .cooler-tap.cold { background: #4a8aea; }

    .cooler-stand {
      width: 24px; height: 12px;
      border-left: 3px solid #b0a080;
      border-right: 3px solid #b0a080;
      border-bottom: 3px solid #b0a080;
      border-radius: 0 0 2px 2px;
    }

    /* ── Whiteboard ── */
    .whiteboard {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 6px;
      animation: fadeUp 0.5s ease 0.15s both;
    }

    .wb-frame {
      width: 220px; height: 64px;
      background: #f0ece4;
      border: 3px solid #a0a0a0;
      border-radius: 3px;
      box-shadow: 0 3px 0 #888, 0 5px 8px rgba(0,0,0,0.08);
      padding: 8px 12px;
      display: flex; flex-direction: column; gap: 5px;
    }

    .wb-line { height: 2px; border-radius: 1px; opacity: 0.35; }

    .wb-tray {
      width: 80px; height: 5px;
      background: #c0c0c0; border: 1px solid #a0a0a0;
      border-radius: 0 0 3px 3px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }

    .wb-marker { width: 10px; height: 3px; border-radius: 1px; }

    /* ── Couch / Lounge Area ── */
    .lounge-area {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 20px; padding: 16px 0 8px;
      animation: fadeUp 0.5s ease 0.4s both;
    }

    .couch { display: flex; flex-direction: column; align-items: center; }

    .couch-back {
      width: 110px; height: 16px;
      background: linear-gradient(180deg, #6a5a8a, #5a4a7a);
      border: 2px solid #4a3a6a;
      border-radius: 6px 6px 0 0;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.08);
    }

    .couch-seat {
      width: 120px; height: 12px;
      background: #7a6a9a;
      border: 2px solid #5a4a7a; border-top: none;
      border-radius: 0 0 4px 4px;
      display: flex; align-items: center; justify-content: center; gap: 18px;
    }

    .couch-cushion {
      width: 2px; height: 6px;
      background: rgba(0,0,0,0.1); border-radius: 1px;
    }

    .couch-legs { display: flex; justify-content: space-between; width: 110px; }

    .couch-leg {
      width: 4px; height: 5px;
      background: #4a3a6a; border-radius: 0 0 2px 2px;
    }

    .side-table { display: flex; flex-direction: column; align-items: center; }

    .side-table-top {
      width: 32px; height: 5px;
      background: linear-gradient(180deg, #b09870, #9a8660);
      border: 1.5px solid #7a6a4a; border-radius: 2px;
      box-shadow: 0 2px 0 #6a5a3a;
    }

    .side-table-leg { width: 3px; height: 12px; background: #7a6a4a; }

    .side-table-item { font-size: 12px; margin-bottom: 2px; }

    .rug {
      width: 180px; height: 6px;
      background: repeating-linear-gradient(90deg, #8a6a5a 0px, #8a6a5a 8px, #9a7a6a 8px, #9a7a6a 16px);
      border-radius: 3px; border: 1px solid #7a5a4a; opacity: 0.45;
      margin-top: 4px;
    }

    /* ════════════════════════════════
       CHAT VIEW — Retro Workroom Theme
       ════════════════════════════════ */
    #chatView {
      display: flex; flex: 1;
      background: #ece5d5;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #c8bc9a;
      display: flex; flex-direction: column;
      border-right: 2px solid #a89878;
      flex-shrink: 0; position: relative; z-index: 10;
    }

    .sidebar::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 30%);
      pointer-events: none;
    }

    .sidebar > * { position: relative; z-index: 1; }

    .sidebar-header { padding: 20px 16px 16px; border-bottom: 2px solid #a89878; }

    .sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

    .sidebar-logo {
      width: 32px; height: 32px; background: #3a3a52; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: 12px; color: #e8e0d0;
      box-shadow: 0 2px 0 #2a2a3f;
      border: 2px solid #4a4a62;
    }

    .sidebar-brand-text {
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: 10px;
      color: #4a3a2a; letter-spacing: 0.5px;
    }

    .back-btn {
      width: 100%; padding: 10px 12px; margin-bottom: 8px;
      background: #b8ac8a; border: 2px solid #a89878;
      border-radius: 6px; color: #5a4a3a;
      font-family: 'Press Start 2P', monospace; font-size: 7px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 0 #98886a;
    }

    .back-btn:hover { background: #a89878; color: #3a2a1a; box-shadow: 0 1px 0 #98886a; transform: translateY(1px); }

    .back-btn svg {
      width: 12px; height: 12px; stroke: currentColor; fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .new-chat-btn {
      width: 100%; padding: 10px 12px;
      background: #3a3a52; border: 2px solid #4a4a62;
      border-radius: 6px; color: #e8e0d0;
      font-family: 'Press Start 2P', monospace; font-size: 7px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 0 #2a2a3f;
    }

    .new-chat-btn:hover { background: #4a4a62; box-shadow: 0 1px 0 #2a2a3f; transform: translateY(1px); }

    .new-chat-btn svg {
      width: 14px; height: 14px; stroke: currentColor; fill: none;
      stroke-width: 2.5; stroke-linecap: round;
    }

    .new-chat-btn .shortcut {
      margin-left: auto; font-family: 'Press Start 2P', monospace; font-size: 6px;
      color: #8a8a9a; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 3px;
    }

    .session-list { flex: 1; overflow-y: auto; padding: 10px; }
    .session-list::-webkit-scrollbar { width: 6px; }
    .session-list::-webkit-scrollbar-track { background: transparent; }
    .session-list::-webkit-scrollbar-thumb { background: #a89878; border-radius: 4px; }

    .session-group-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px; text-transform: uppercase; letter-spacing: 0.5px;
      color: #7a6a5a; padding: 10px 8px 6px;
    }

    .session-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px;
      cursor: pointer; transition: all 0.15s ease; margin-bottom: 2px; position: relative;
      border: 1px solid transparent;
    }

    .session-item:hover { background: rgba(0,0,0,0.05); border-color: #a89878; }
    .session-item.active { background: #b8ac8a; border-color: #a89878; box-shadow: 0 1px 0 #98886a; }

    .session-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 18px; background: #3a3a52; border-radius: 0 3px 3px 0;
    }

    .session-icon {
      width: 28px; height: 28px; background: rgba(0,0,0,0.05); border-radius: 6px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .session-icon svg {
      width: 13px; height: 13px; stroke: #7a6a5a; fill: none;
      stroke-width: 2; stroke-linecap: round;
    }

    .session-item.active .session-icon { background: #a89878; border-color: #98886a; }
    .session-item.active .session-icon svg { stroke: #3a2a1a; }

    .session-info { flex: 1; min-width: 0; }

    .session-title {
      font-size: 12px; font-weight: 600; color: #4a3a2a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: 'DM Sans', sans-serif;
    }

    .session-item.active .session-title { color: #2a1a0a; }
    .session-time { font-size: 10px; color: #8a7a6a; margin-top: 2px; font-family: 'DM Sans', sans-serif; }

    .session-delete {
      opacity: 0; background: none; border: none; cursor: pointer; padding: 4px; border-radius: 4px;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    }

    .session-delete svg {
      width: 13px; height: 13px; stroke: #8a7a6a; fill: none;
      stroke-width: 2; stroke-linecap: round;
    }

    .session-item:hover .session-delete { opacity: 1; }
    .session-delete:hover { background: rgba(234,74,74,0.12); }
    .session-delete:hover svg { stroke: #ea4a4a; }

    .sidebar-footer { padding: 14px 16px; border-top: 2px solid #a89878; }

    .sidebar-footer-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px; color: #6a5a4a; display: flex; align-items: center; gap: 6px;
    }

    .sidebar-footer-text .dot {
      width: 6px; height: 6px; background: #4a8a4a; border-radius: 50%;
      animation: pulse 2s ease-in-out infinite; box-shadow: 0 0 4px rgba(74,138,74,0.4);
    }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Main chat area */
    .chat-main {
      flex: 1; display: flex; flex-direction: column;
      background: #ece5d5; min-width: 0;
    }

    .topbar {
      height: 52px; border-bottom: 2px solid #c8bc9a;
      display: flex; align-items: center; padding: 0 20px; gap: 10px;
      background: #d8d0be; flex-shrink: 0;
    }

    .topbar-agent {
      display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
    }

    .topbar-agent-emoji { font-size: 18px; }

    .topbar-agent-info { min-width: 0; }

    .topbar-title {
      font-family: 'Press Start 2P', monospace; font-size: 9px;
      color: #3a2a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .topbar-role { font-family: 'DM Sans', sans-serif; font-size: 11px; color: #7a6a5a; margin-top: 2px; }

    .topbar-session-id {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7a6a5a;
      background: #c8bc9a; padding: 3px 8px; border-radius: 4px; border: 1px solid #b8ac8a;
      flex-shrink: 0;
    }

    .sidebar-toggle {
      display: none; background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px;
    }

    .sidebar-toggle svg {
      width: 18px; height: 18px; stroke: #6a5a4a; fill: none;
      stroke-width: 2; stroke-linecap: round;
    }

    .sidebar-toggle:hover { background: #c8bc9a; }

    .messages { flex: 1; overflow-y: auto; scroll-behavior: smooth; background: #ece5d5; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #c8bc9a; border-radius: 4px; }

    .messages-inner {
      max-width: 680px; margin: 0 auto; padding: 20px 28px;
      display: flex; flex-direction: column; gap: 4px;
    }

    .welcome {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 60px 28px 40px; animation: fadeUp 0.5s ease both;
    }

    .welcome-icon {
      width: 64px; height: 64px;
      background: #d4c8a8;
      border: 2px solid #b8ac8a;
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; font-size: 28px;
      box-shadow: 0 3px 0 #a89878;
    }

    .welcome h2 {
      font-family: 'Press Start 2P', monospace; font-size: 14px;
      color: #3a2a1a; letter-spacing: 0.5px; margin-bottom: 10px;
    }

    .welcome p { font-size: 13px; color: #6a5a4a; line-height: 1.6; max-width: 380px; font-family: 'DM Sans', sans-serif; }

    .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 28px; }

    .welcome-chip {
      padding: 9px 16px; border-radius: 6px;
      border: 2px solid #c8bc9a;
      background: #d8d0be; font-size: 12px; color: #5a4a3a;
      cursor: pointer; transition: all 0.15s ease; font-family: 'DM Sans', sans-serif;
      box-shadow: 0 2px 0 #b8ac8a;
    }

    .welcome-chip:hover {
      border-color: #a89878; color: #3a2a1a; background: #c8bc9a;
      box-shadow: 0 1px 0 #a89878; transform: translateY(1px);
    }

    .message {
      max-width: 85%; padding: 12px 16px; line-height: 1.6; font-size: 13.5px;
      animation: msgIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
      word-wrap: break-word; position: relative;
      font-family: 'DM Sans', sans-serif;
    }

    .message.user { white-space: pre-wrap; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bot {
      background: #d8d0be; border: 2px solid #c8bc9a; color: #3a2a1a;
      border-radius: 4px 14px 14px 14px; align-self: flex-start;
      box-shadow: 0 2px 0 #b8ac8a;
    }

    .user {
      background: #3a3a52; color: #e8e0d0;
      border-radius: 14px 4px 14px 14px; align-self: flex-end;
      box-shadow: 0 2px 0 #2a2a3f;
      border: 2px solid #4a4a62;
    }

    /* ── Markdown content in bot messages ── */
    .bot .md-content p { margin: 0 0 10px; }
    .bot .md-content p:last-child { margin-bottom: 0; }
    .bot .md-content strong { font-weight: 600; color: #2a1a0a; }
    .bot .md-content em { font-style: italic; }

    .bot .md-content h1, .bot .md-content h2, .bot .md-content h3 {
      font-family: 'Press Start 2P', monospace; color: #3a2a1a;
      margin: 14px 0 8px;
    }

    .bot .md-content h1 { font-size: 11px; }
    .bot .md-content h2 { font-size: 10px; }
    .bot .md-content h3 { font-size: 9px; }
    .bot .md-content h1:first-child, .bot .md-content h2:first-child, .bot .md-content h3:first-child { margin-top: 0; }

    .bot .md-content ul, .bot .md-content ol {
      margin: 8px 0; padding-left: 18px;
    }

    .bot .md-content li { margin-bottom: 4px; }
    .bot .md-content li::marker { color: #8a7a5a; }

    .bot .md-content code {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      background: #c8bc9a; padding: 2px 6px; border-radius: 4px;
      border: 1px solid #b8ac8a;
    }

    .bot .md-content pre {
      background: #2a2a3f; color: #e8e0d0;
      padding: 12px 14px; border-radius: 6px; margin: 10px 0;
      overflow-x: auto; font-size: 12px; line-height: 1.5;
      border: 2px solid #3a3a52;
      box-shadow: 0 2px 0 #1a1a2f;
    }

    .bot .md-content pre code {
      background: none; padding: 0; border: none; border-radius: 0;
      color: inherit; font-size: inherit;
    }

    .bot .md-content a {
      color: #3a6aea; text-decoration: none; font-weight: 500;
      border-bottom: 1px solid rgba(58,106,234,0.3); transition: border-color 0.15s;
    }

    .bot .md-content a:hover { border-color: #3a6aea; }

    .bot .md-content blockquote {
      border-left: 3px solid #a89878; padding-left: 12px;
      margin: 10px 0; color: #6a5a4a; font-style: italic;
    }

    .bot .md-content hr {
      border: none; border-top: 1px solid #c8bc9a; margin: 12px 0;
    }

    .bot .md-content table {
      width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px;
    }

    .bot .md-content th, .bot .md-content td {
      padding: 7px 10px; text-align: left;
      border-bottom: 1px solid #c8bc9a;
    }

    .bot .md-content th {
      font-weight: 600; color: #3a2a1a;
      background: #c8bc9a; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }

    /* ── Copy button ── */
    .msg-wrapper { position: relative; align-self: flex-start; max-width: 85%; }
    .msg-wrapper.user-wrap { align-self: flex-end; }

    .copy-btn {
      position: absolute; top: 6px; right: 6px;
      width: 26px; height: 26px; border-radius: 5px;
      background: #c8bc9a; border: 1px solid #b8ac8a;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: all 0.15s ease;
      z-index: 2;
    }

    .copy-btn svg { width: 12px; height: 12px; stroke: #6a5a4a; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .msg-wrapper:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: #d8d0be; border-color: #a89878; }
    .copy-btn:hover svg { stroke: #3a2a1a; }
    .copy-btn.copied { background: rgba(74,138,74,0.15); border-color: rgba(74,138,74,0.3); }
    .copy-btn.copied svg { stroke: #4a8a4a; }

    .typing-indicator { display: inline-flex; gap: 5px; padding: 14px 18px; align-items: center; }

    .typing-indicator span {
      width: 6px; height: 6px; background: #8a7a5a; border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%,60%,100% { opacity: 0.2; transform: translateY(0); }
      30% { opacity: 0.8; transform: translateY(-4px); }
    }

    .input-area { padding: 0 28px 20px; max-width: 680px; margin: 0 auto; width: 100%; background: #ece5d5; }

    .input-container {
      background: #d8d0be; border: 2px solid #c8bc9a; border-radius: 10px;
      padding: 6px 6px 6px 16px; display: flex; align-items: flex-end; gap: 6px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 0 #b8ac8a;
    }

    .input-container:focus-within {
      border-color: #a89878;
      box-shadow: 0 2px 0 #98886a, 0 0 0 2px rgba(168,152,120,0.2);
    }

    .input-container textarea {
      flex: 1; border: none; background: transparent; resize: none;
      height: 24px; max-height: 100px; font-family: 'DM Sans', sans-serif;
      font-size: 13.5px; color: #3a2a1a; outline: none; padding: 7px 0; line-height: 1.5;
    }

    .input-container textarea::placeholder { color: #8a7a6a; }

    .send-btn {
      width: 36px; height: 36px; border-radius: 8px; border: 2px solid #4a4a62;
      background: #3a3a52; color: #e8e0d0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.15s ease;
      box-shadow: 0 2px 0 #2a2a3f;
    }

    .send-btn:hover { background: #4a4a62; box-shadow: 0 1px 0 #2a2a3f; transform: translateY(1px); }
    .send-btn:active { transform: scale(0.95) translateY(1px); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: 0 2px 0 #2a2a3f; }

    .send-btn.loading svg { display: none; }
    .send-btn.loading::after {
      content: ''; width: 16px; height: 16px;
      border: 2px solid rgba(232,224,208,0.3); border-top-color: #e8e0d0;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 6px;
      background: #d8d0be; border: 2px solid #c8bc9a;
      color: #5a4a3a; font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 0 #b8ac8a;
    }

    .retry-btn:hover {
      background: #c8bc9a; border-color: #a89878;
      box-shadow: 0 1px 0 #98886a; transform: translateY(1px);
    }

    .retry-btn svg {
      width: 13px; height: 13px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .send-btn svg {
      width: 16px; height: 16px; fill: none; stroke: currentColor;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .input-hint { text-align: center; font-size: 10px; color: #8a7a6a; opacity: 0.6; margin-top: 8px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .side-nav { width: 60px; }
      .side-icon { width: 36px; height: 36px; font-size: 16px; }
      .side-label { font-size: 5px; }
      .desk-row { gap: 16px; }
      .desk-table { width: 100px; }
      .bookshelf, .filing-cabinet, .water-cooler { display: none; }
      .whiteboard .wb-frame { width: 180px; height: 52px; }
      .lounge-area { gap: 14px; }
      .couch-back { width: 90px; }
      .couch-seat { width: 100px; }
      .couch-legs { width: 90px; }
    }

    @media (max-width: 768px) {
      .room-scene { padding: 20px 12px 0; }
      .banner-frame h1 { font-size: 13px; }
      .banner-frame { padding: 10px 24px; }
      .side-nav { display: none; }
      .desk-area { padding: 8px 0 0; }
      .desk-row { flex-direction: column; align-items: center; gap: 12px; }
      .desk-row.back, .desk-row.front { transform: scale(1); margin-bottom: 0; }
      .room-floor { height: 80px; }
      .pixel-char { width: 52px; height: 60px; }
      .desk-table { width: 100px; height: 16px; }
      .desk-name { font-size: 8px; }
      .whiteboard { display: none; }
      .lounge-area { display: none; }
      .rug { display: none; }

      .browser-window {
        width: 100vw; height: 100vh;
        max-width: none; max-height: none;
        border-radius: 0;
      }

      .browser-toolbar { padding: 10px 12px; }

      .sidebar {
        position: fixed; left: -280px; top: 0; height: 100vh; z-index: 100;
        transition: left 0.3s cubic-bezier(0.16,1,0.3,1);
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(2,0,68,0.5); backdrop-filter: blur(4px); z-index: 99;
      }
      .sidebar.open ~ .sidebar-overlay { display: block; }
      .sidebar-toggle { display: flex; }
      .messages-inner, .input-area { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>

          </div>
          <div class="couch-legs">

  <!-- ════════ CHAT OVERLAY ════════ -->
  <div class="chat-overlay" id="chatOverlay">

    <main class="chat-main">

  <script>
    // ═══════════════════════════════════════
    // AGENT CONFIG — all in one place
    // ═══════════════════════════════════════
    var AGENTS = [
      {
        category: "Onboarding & Training", categoryIcon: "\uD83D\uDCCB",
        agents: [
          { id: "scout", name: "Scout", emoji: "\uD83D\uDD0D", role: "Product Feedback", desc: "Knowledge of feedback submitted for product features.", capabilities: ["Weekly Feature Requests", "Feature-specific issues", "Feature tracking & check-ins"], frequency: "Always on", badgeColor: "green", webhook: "https://trainual.app.n8n.cloud/webhook/3d55d6c4-dd85-4160-99be-df6c47a7c27c/chat", chips: ["Share highlights of feedback in the last week", "What is the most common feature request"] },
          { id: "sage", name: "Sage", emoji: "\uD83D\uDCDA", role: "Knowledge Base Expert", desc: "Instantly finds and explains any SOP, policy, or training document.", capabilities: ["Full Trainual content search", "Plain-language explanations", "Source linking & citations"], frequency: "Always on", badgeColor: "green", webhook: "", chips: [] },
          { id: "coach", name: "Coach", emoji: "\uD83C\uDFAF", role: "Training Assessor", desc: "Creates quizzes and assessments to verify training completion and comprehension.", capabilities: ["Auto-generated assessments", "Competency scoring", "Knowledge gap reports"], frequency: "On demand", badgeColor: "purple", webhook: "", chips: [] }
        ]
      },
      {
        category: "Process & Compliance", categoryIcon: "\u2699\uFE0F",
        agents: [
          { id: "warden", name: "Warden", emoji: "\uD83D\uDEE1\uFE0F", role: "Compliance Monitor", desc: "Tracks training completion rates and flags compliance gaps across teams.", capabilities: ["Completion rate dashboards", "Overdue training alerts", "Compliance audit reports"], frequency: "Daily", badgeColor: "blue", webhook: "", chips: [] },
          { id: "quill", name: "Quill", emoji: "\u270D\uFE0F", role: "SOP Writer", desc: "Helps draft, refine, and format standard operating procedures from scratch.", capabilities: ["SOP drafting from prompts", "Brand voice adherence", "Template formatting"], frequency: "On demand", badgeColor: "purple", webhook: "", chips: [] },
          { id: "prism", name: "Prism", emoji: "\uD83D\uDCCA", role: "Analytics Reporter", desc: "Generates training analytics, engagement metrics, and team progress reports.", capabilities: ["Weekly engagement reports", "Team progress breakdowns", "Trend analysis & insights"], frequency: "Weekly", badgeColor: "yellow", webhook: "", chips: [] }
        ]
      }
    ];

    // ═══════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════
    var STORAGE_KEY = "trainual_sessions";
    var currentAgent = null;
    var sessions = [];
    var activeSessionId = null;
    var isSending = false;

    // Flatten agents for lookup
    var agentMap = {};
    AGENTS.forEach(function(cat) {
      cat.agents.forEach(function(a) { agentMap[a.id] = a; });
    });

    // ═══════════════════════════════════════
    // DOM
    // ═══════════════════════════════════════
    var hubView = document.getElementById('hubView');
    var chatView = document.getElementById('chatView');
    var chatOverlay = document.getElementById('chatOverlay');
    var chatBackdrop = document.getElementById('chatBackdrop');
    var browserClose = document.getElementById('browserClose');
    var browserUrl = document.getElementById('browserUrl');
    var messagesEl = document.getElementById('messages');
    var messagesInner = document.getElementById('messagesInner');
    var inputEl = document.getElementById('input');
    var sendBtn = document.getElementById('sendBtn');
    var sessionListEl = document.getElementById('sessionList');
    var topbarTitle = document.getElementById('topbarTitle');
    var topbarRole = document.getElementById('topbarRole');
    var topbarEmoji = document.getElementById('topbarEmoji');
    var topbarSessionId = document.getElementById('topbarSessionId');
    var newChatBtn = document.getElementById('newChatBtn');
    var backBtn = document.getElementById('backBtn');
    var sidebar = document.getElementById('sidebar');
    var sidebarToggle = document.getElementById('sidebarToggle');
    var sidebarOverlay = document.getElementById('sidebarOverlay');

    // ═══════════════════════════════════════
    // VIEW SWITCHING
    // ═══════════════════════════════════════
    function showHub() {
      chatOverlay.classList.remove('open');
      currentAgent = null;
      document.title = 'Trainual Agent Hub';
    }

    function showChat(agentId) {
      var agent = agentMap[agentId];
      if (!agent || !agent.webhook) return;

      currentAgent = agent;
      document.title = agent.name + ' — Trainual';
      inputEl.placeholder = 'Ask ' + agent.name + ' anything...';
      browserUrl.textContent = 'trainual-n8n-chat.pages.dev/chat/' + agent.id;

      sessions = loadSessions(agent.id);
      activeSessionId = null;

      topbarEmoji.textContent = agent.emoji;
      topbarRole.textContent = agent.role;

      chatOverlay.classList.add('open');

      renderSessionList();
      if (sessions.length > 0) {
        switchToSession(sessions[0].id);
      } else {
        renderEmptyState();
      }

      inputEl.focus();
    }

    // ═══════════════════════════════════════
    // SESSION MANAGEMENT (per-agent)
    // ═══════════════════════════════════════
    function storageKey(agentId) { return STORAGE_KEY + '_' + agentId; }

    function generateId() { return 'sess_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    function loadSessions(agentId) {
      try { return JSON.parse(localStorage.getItem(storageKey(agentId))) || []; }
      catch (e) { return []; }
    }

    function saveSessions() {
      if (!currentAgent) return;
      localStorage.setItem(storageKey(currentAgent.id), JSON.stringify(sessions));
    }

    function createSession() {
      var session = { id: generateId(), title: "New conversation", messages: [], createdAt: Date.now(), updatedAt: Date.now() };
      sessions.unshift(session);
      saveSessions();
      switchToSession(session.id);
      return session;
    }

    function deleteSession(id, e) {
      e.stopPropagation();
      sessions = sessions.filter(function(s) { return s.id !== id; });
      saveSessions();
      if (activeSessionId === id) {
        if (sessions.length > 0) switchToSession(sessions[0].id);
        else { activeSessionId = null; renderEmptyState(); }
      }
      renderSessionList();
    }

    function switchToSession(id) {
      activeSessionId = id;
      var session = sessions.find(function(s) { return s.id === id; });
      if (!session) return;
      topbarTitle.textContent = session.title === 'New conversation' ? currentAgent.name : session.title;
      topbarSessionId.textContent = session.id;
      renderMessages(session);
      renderSessionList();
      closeSidebar();
    }

    function getActiveSession() {
      return sessions.find(function(s) { return s.id === activeSessionId; });
    }

    function updateSessionTitle(session) {
      var first = session.messages.find(function(m) { return m.type === 'user'; });
      if (first) {
        session.title = first.text.length > 40 ? first.text.slice(0, 40) + '\u2026' : first.text;
        topbarTitle.textContent = session.title;
      }
    }

    // ═══════════════════════════════════════
    // RENDERING — Chat
    // ═══════════════════════════════════════
    function escapeHtml(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function renderEmptyState() {
      topbarTitle.textContent = currentAgent.name;
      topbarSessionId.textContent = '';
      messagesInner.innerHTML = '';
      messagesInner.appendChild(createWelcome());
    }

    function createWelcome() {
      var agent = currentAgent;
      var div = document.createElement('div');
      div.className = 'welcome'; div.id = 'welcome';

      var chipsHtml = '';
      if (agent.chips && agent.chips.length) {
        chipsHtml = '<div class="welcome-chips">' + agent.chips.map(function(c) {
          return '<div class="welcome-chip" data-q="' + escapeHtml(c) + '">' + escapeHtml(c) + '</div>';
        }).join('') + '</div>';
      }

      div.innerHTML = '<div class="welcome-icon">' + agent.emoji + '</div><h2>' + escapeHtml(agent.name) + '</h2><p>' + escapeHtml(agent.desc) + '</p>' + chipsHtml;

      div.querySelectorAll('.welcome-chip').forEach(function(chip) {
        chip.addEventListener('click', function() { inputEl.value = chip.dataset.q; sendMessage(); });
      });
      return div;
    }

    function renderMessages(session) {
      messagesInner.innerHTML = '';
      if (session.messages.length === 0) messagesInner.appendChild(createWelcome());
      else session.messages.forEach(function(msg) { addMessageBubble(msg.text, msg.type, false); });
      scrollToBottom();
    }

    // Configure marked
    marked.setOptions({ breaks: true, gfm: true });
    var renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
      // Handle both old and new marked.js API
      if (typeof href === 'object') { title = href.title; text = href.text; href = href.href; }
      var titleAttr = title ? ' title="' + title + '"' : '';
      return '<a href="' + href + '"' + titleAttr + ' target="_blank" rel="noopener noreferrer">' + text + '</a>';
    };
    marked.setOptions({ renderer: renderer });

    function renderMarkdown(text) {
      try { return marked.parse(text); }
      catch (e) { return escapeHtml(text); }
    }

    function addMessageBubble(text, type, animate) {
      if (animate === undefined) animate = true;
      var welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      if (type === 'bot') {
        var wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper';
        if (!animate) wrapper.style.animation = 'none';

        var div = document.createElement('div');
        div.className = 'message bot';
        if (!animate) div.style.animation = 'none';

        var mdContent = document.createElement('div');
        mdContent.className = 'md-content';
        mdContent.innerHTML = renderMarkdown(text);
        div.appendChild(mdContent);

        // Copy button
        var copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.title = 'Copy to clipboard';
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
        copyBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          navigator.clipboard.writeText(text).then(function() {
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
            setTimeout(function() {
              copyBtn.classList.remove('copied');
              copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
            }, 2000);
          });
        });

        wrapper.appendChild(div);
        wrapper.appendChild(copyBtn);
        messagesInner.appendChild(wrapper);
      } else {
        var div = document.createElement('div');
        div.className = 'message user';
        if (!animate) div.style.animation = 'none';
        div.textContent = text;
        messagesInner.appendChild(div);
      }

      scrollToBottom();
    }

    function showTyping() {
      var div = document.createElement('div');
      div.className = 'message bot typing-indicator'; div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      messagesInner.appendChild(div); scrollToBottom();
    }

    function removeTyping() { var el = document.getElementById('typing'); if (el) el.remove(); }
    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    // Session list
    function renderSessionList() {
      sessionListEl.innerHTML = '';
      if (sessions.length === 0) {
        sessionListEl.innerHTML = '<div style="padding:24px 8px;text-align:center"><p style="font-size:11px;color:#7a6a5a;line-height:1.5;font-family:DM Sans,sans-serif">No conversations yet.<br>Start a new chat to begin.</p></div>';
        return;
      }
      var now = Date.now(), today = [], yesterday = [], older = [];
      sessions.forEach(function(s) {
        var age = now - s.updatedAt;
        if (age < 86400000) today.push(s);
        else if (age < 172800000) yesterday.push(s);
        else older.push(s);
      });
      if (today.length) renderGroup("Today", today);
      if (yesterday.length) renderGroup("Yesterday", yesterday);
      if (older.length) renderGroup("Previous", older);
    }

    function renderGroup(label, items) {
      var gl = document.createElement('div'); gl.className = 'session-group-label'; gl.textContent = label;
      sessionListEl.appendChild(gl);
      items.forEach(function(s) {
        var item = document.createElement('div');
        item.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
        item.innerHTML = '<div class="session-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="session-info"><div class="session-title">' + escapeHtml(s.title) + '</div><div class="session-time">' + s.messages.length + ' message' + (s.messages.length !== 1 ? 's' : '') + '</div></div>';
        var del = document.createElement('button'); del.className = 'session-delete'; del.title = 'Delete';
        del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';
        del.addEventListener('click', function(e) { deleteSession(s.id, e); });
        item.appendChild(del);
        item.addEventListener('click', function() { switchToSession(s.id); });
        sessionListEl.appendChild(item);
      });
    }

    // ═══════════════════════════════════════
    // SENDING
    // ═══════════════════════════════════════
    var TIMEOUT_MS = 180000;
    var lastFailedText = null;

    function sendMessage(retryText) {
      var text = retryText || inputEl.value.trim();
      if (!text || isSending || !currentAgent) return;
      if (!activeSessionId) createSession();
      var session = getActiveSession();
      if (!session) return;

      isSending = true; sendBtn.disabled = true;
      sendBtn.classList.add('loading');
      lastFailedText = null;

      // Remove any existing retry buttons
      var oldRetry = document.querySelector('.retry-btn');
      if (oldRetry) oldRetry.parentElement.remove();

      if (!retryText) {
        session.messages.push({ text: text, type: 'user' });
        session.updatedAt = Date.now();
        updateSessionTitle(session); saveSessions(); renderSessionList();
        addMessageBubble(text, 'user');
      }
      inputEl.value = ''; inputEl.style.height = '24px';
      showTyping();

      // Timeout controller
      var controller = new AbortController();
      var timeoutId = setTimeout(function() { controller.abort(); }, TIMEOUT_MS);

      fetch(currentAgent.webhook, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatInput: text, sessionId: session.id, agent: currentAgent.id }),
        signal: controller.signal
      }).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function(data) {
        clearTimeout(timeoutId);
        removeTyping();
        var botMessages = [];
        if (data && data.messages && data.messages.length) botMessages = data.messages.map(function(m) { return m.text; });
        else if (Array.isArray(data)) botMessages = data.map(function(m) { return m.output || m.text; }).filter(Boolean);
        else if (data && data.output) botMessages = [data.output];

        if (botMessages.length === 0) {
          botMessages = ["I received your message but couldn\u2019t generate a response. Try rephrasing your question."];
        }

        botMessages.forEach(function(t, i) {
          setTimeout(function() {
            session.messages.push({ text: t, type: 'bot' });
            session.updatedAt = Date.now(); saveSessions();
            addMessageBubble(t, 'bot');
          }, i * 120);
        });
      }).catch(function(err) {
        clearTimeout(timeoutId);
        removeTyping();
        lastFailedText = text;
        var errText = err.name === 'AbortError'
          ? "That took too long \u2014 the agent may be busy. Try again?"
          : "Something went wrong connecting to " + currentAgent.name + ". Try again?";
        session.messages.push({ text: errText, type: 'bot' }); saveSessions();
        addMessageBubble(errText, 'bot');
        addRetryButton();
      }).finally(function() {
        isSending = false; sendBtn.disabled = false;
        sendBtn.classList.remove('loading');
        inputEl.focus();
      });
    }

    function addRetryButton() {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'align-self:flex-start;animation:msgIn 0.3s cubic-bezier(0.16,1,0.3,1) both';
      var btn = document.createElement('button');
      btn.className = 'retry-btn';
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 105.64-11.36L3 10"/></svg> Retry';
      btn.addEventListener('click', function() {
        if (lastFailedText) sendMessage(lastFailedText);
      });
      wrap.appendChild(btn);
      messagesInner.appendChild(wrap);
      scrollToBottom();
    }

    // ═══════════════════════════════════════
    // PIXEL CHARACTERS — cute blocky creatures
    // ═══════════════════════════════════════
    var PIXEL_CHARS = {
      scout: {
        color: '#3aaa6a',
        nameColor: '#2a8a4a',
        svg: '<svg viewBox="0 0 32 40"><rect x="8" y="4" width="16" height="14" rx="2" fill="#4ac47a"/><rect x="13" y="0" width="6" height="6" rx="1" fill="#6ae49a"/><circle cx="16" cy="1" r="2" fill="#3aaa6a"/><rect x="12" y="9" width="3" height="3" fill="#1a2a1a"/><rect x="17" y="9" width="3" height="3" fill="#1a2a1a"/><rect x="12" y="9" width="1.5" height="1.5" fill="#fff"/><rect x="17" y="9" width="1.5" height="1.5" fill="#fff"/><rect x="13" y="14" width="6" height="2" rx="1" fill="#2a7a3a"/><rect x="6" y="18" width="20" height="16" rx="2" fill="#3aaa6a"/><rect x="10" y="22" width="12" height="2" rx="1" fill="#2a8a4a"/><rect x="2" y="20" width="5" height="10" rx="2" fill="#3aaa6a"/><rect x="25" y="20" width="5" height="10" rx="2" fill="#3aaa6a"/><rect x="8" y="34" width="6" height="4" rx="1" fill="#2a8a4a"/><rect x="18" y="34" width="6" height="4" rx="1" fill="#2a8a4a"/></svg>'
      },
      sage: {
        color: '#6a3adc',
        nameColor: '#5a2acc',
        svg: '<svg viewBox="0 0 32 40"><rect x="8" y="4" width="16" height="14" rx="2" fill="#8a5afc"/><rect x="6" y="2" width="8" height="5" rx="1" fill="#6a3adc"/><rect x="18" y="2" width="8" height="5" rx="1" fill="#6a3adc"/><rect x="11" y="8" width="4" height="4" rx="1" fill="#e8e0f0" stroke="#5a2acc" stroke-width="0.5"/><rect x="17" y="8" width="4" height="4" rx="1" fill="#e8e0f0" stroke="#5a2acc" stroke-width="0.5"/><rect x="12" y="9" width="2" height="2" fill="#1a1a2a"/><rect x="18" y="9" width="2" height="2" fill="#1a1a2a"/><rect x="14" y="14" width="4" height="1.5" rx="0.5" fill="#5a2acc"/><rect x="6" y="18" width="20" height="16" rx="2" fill="#6a3adc"/><rect x="11" y="21" width="10" height="8" rx="1" fill="#5a2acc"/><rect x="13" y="23" width="6" height="1" fill="#8a6aec"/><rect x="13" y="25" width="4" height="1" fill="#8a6aec"/><rect x="2" y="20" width="5" height="10" rx="2" fill="#6a3adc"/><rect x="25" y="20" width="5" height="10" rx="2" fill="#6a3adc"/><rect x="8" y="34" width="6" height="4" rx="1" fill="#5a2acc"/><rect x="18" y="34" width="6" height="4" rx="1" fill="#5a2acc"/></svg>'
      },
      coach: {

      { icon: '\uD83C\uDFE0', label: 'Home' },
      { icon: '\uD83D\uDCD6', label: 'User Guide' },
      { icon: '\uD83D\uDCCB', label: 'SOPs' },
      { icon: '\uD83D\uDDE3\uFE0F', label: 'Talk to\nHuman' },
      { icon: '\u2699\uFE0F', label: 'Settings' }
    ];

    var SIDE_NAV_RIGHT = [
      { icon: '\uD83D\uDCDD', label: 'Changelog' },
      { icon: '\uD83D\uDCD3', label: 'Handbook' },
      { icon: '\uD83C\uDF93', label: 'Training' },
      { icon: '\uD83D\uDCC8', label: 'Analytics' },
      { icon: '\u2753', label: 'Help' }
    ];

    // ═══════════════════════════════════════
    // RENDERING — Pixel Workroom Hub
    // ═══════════════════════════════════════
    function renderHub() {
      // Side navs
      var leftNav = document.getElementById('sideNavLeft');
      var rightNav = document.getElementById('sideNavRight');
      leftNav.innerHTML = '';
      rightNav.innerHTML = '';

      SIDE_NAV_LEFT.forEach(function(item) {
        leftNav.innerHTML += '<div class="side-link"><div class="side-icon">' + item.icon + '</div><div class="side-label">' + item.label + '</div></div>';
      });

      // Bookshelf
      leftNav.innerHTML +=
        '<div class="bookshelf">' +
          '<div class="bookshelf-top"></div>' +
          '<div class="shelf-row">' +
            '<div class="book" style="height:22px;background:#c44a3a"></div>' +
            '<div class="book" style="height:18px;background:#3a7aea"></div>' +
            '<div class="book" style="height:24px;background:#4a8a4a"></div>' +
            '<div class="book" style="height:16px;background:#ea8a2a"></div>' +
            '<div class="book" style="height:20px;background:#8a5adc"></div>' +
            '<div class="book" style="height:22px;background:#da4a8a"></div>' +
          '</div>' +
          '<div class="shelf-divider"></div>' +
          '<div class="shelf-row">' +
            '<div class="book" style="height:20px;background:#3aaa6a"></div>' +
            '<div class="book" style="height:16px;background:#ca9a2a"></div>' +
            '<div class="book" style="height:24px;background:#5a5a7a"></div>' +
            '<div class="book" style="height:18px;background:#ea6a4a"></div>' +
            '<div class="book" style="height:22px;background:#3a6aaa"></div>' +
          '</div>' +
          '<div class="shelf-divider"></div>' +
          '<div class="furniture-label">bookshelf</div>' +
        '</div>';

      // Filing cabinet
      leftNav.innerHTML +=
        '<div class="filing-cabinet">' +
          '<div class="cabinet-body">' +
            '<div class="cabinet-drawer"><div class="cabinet-handle"></div></div>' +
            '<div class="cabinet-drawer"><div class="cabinet-handle"></div></div>' +
            '<div class="cabinet-drawer"><div class="cabinet-handle"></div></div>' +
          '</div>' +
          '<div class="furniture-label">files</div>' +
        '</div>';

      SIDE_NAV_RIGHT.forEach(function(item) {
        rightNav.innerHTML += '<div class="side-link"><div class="side-icon">' + item.icon + '</div><div class="side-label">' + item.label + '</div></div>';
      });

      // Water cooler
      rightNav.innerHTML +=
        '<div class="water-cooler">' +
          '<div class="cooler-jug"></div>' +
          '<div class="cooler-body">' +
            '<div class="cooler-tap hot"></div>' +
            '<div class="cooler-tap cold"></div>' +
          '</div>' +
          '<div class="cooler-stand"></div>' +
          '<div class="furniture-label">water</div>' +
        '</div>';

      // Desk area
      var deskArea = document.getElementById('deskArea');
      deskArea.innerHTML = '';

      // Flatten all agents
      var allAgents = [];
      AGENTS.forEach(function(cat) {
        cat.agents.forEach(function(a) { allAgents.push(a); });
      });

      // Build rows: 3 + coffee bar + 3
      var rows = [
        { agents: allAgents.slice(0, 3), cls: 'back' },
        { agents: allAgents.slice(3, 6), cls: 'front' }
      ];

      // Coffee bar HTML
      var coffeeBarHtml = '<div class="coffee-bar">' +
        '<span class="coffee-plant">&#x1F331;</span>' +
        '<div style="display:flex;flex-direction:column;align-items:center">' +
          '<div style="display:flex;align-items:flex-end;gap:8px">' +
            '<div class="coffee-machine"></div>' +
            '<div style="display:flex;flex-direction:column;align-items:center">' +
              '<div class="coffee-counter">' +
                '<div class="coffee-cup"></div>' +
                '<div class="coffee-cup"></div>' +
                '<div class="coffee-cup"></div>' +
              '</div>' +
              '<div class="coffee-counter-legs">' +
                '<div class="coffee-counter-leg"></div>' +
                '<div class="coffee-counter-leg"></div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="coffee-label">&#x2615; coffee bar</div>' +
        '</div>' +
        '<span class="coffee-plant">&#x1FAB4;</span>' +
      '</div>';

      rows.forEach(function(rowData, ri) {
        var row = document.createElement('div');
        row.className = 'desk-row ' + rowData.cls;

        rowData.agents.forEach(function(agent, ai) {
          var isActive = agent.webhook !== '';
          var pc = PIXEL_CHARS[agent.id] || PIXEL_CHARS.scout;

          var unit = document.createElement('div');
          unit.className = 'desk-unit' + (!isActive ? ' offline' : '');
          unit.style.animationDelay = ((ri * 0.15) + (ai * 0.08)) + 's';

          unit.innerHTML =
            '<div class="pixel-char">' + pc.svg + '</div>' +
            '<div class="chair"></div>' +
            '<div class="desk-table">' +
              '<div class="laptop-screen"></div>' +
              '<div class="laptop-keys"></div>' +
            '</div>' +
            '<div class="desk-legs">' +
              '<div class="desk-leg"></div>' +
              '<div class="desk-leg"></div>' +
            '</div>' +
            '<div class="desk-name" style="color:' + pc.nameColor + '">' + escapeHtml(agent.name) + '</div>' +
            '<div class="desk-role">' + escapeHtml(agent.role) + '</div>' +
            '<div class="desk-status ' + (isActive ? 'online' : 'away') + '">' +
              (isActive ? '\u25CF Online' : '\u25CB Coming soon') +
            '</div>';

          if (isActive) {
            unit.addEventListener('click', function() { showChat(agent.id); });
          }

          row.appendChild(unit);
        });

        deskArea.appendChild(row);
        if (ri === 0) deskArea.insertAdjacentHTML('beforeend', coffeeBarHtml);
      });
    }

    // ═══════════════════════════════════════
    // EVENTS
    // ═══════════════════════════════════════
    function closeSidebar() { sidebar.classList.remove('open'); }

    backBtn.addEventListener('click', showHub);
    browserClose.addEventListener('click', showHub);
    chatBackdrop.addEventListener('click', showHub);
    sidebarToggle.addEventListener('click', function() { sidebar.classList.toggle('open'); });
    sidebarOverlay.addEventListener('click', closeSidebar);
    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    inputEl.addEventListener('input', function() {
      inputEl.style.height = '24px';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    newChatBtn.addEventListener('click', function() { createSession(); renderSessionList(); inputEl.focus(); });

    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'n' && currentAgent) { e.preventDefault(); createSession(); inputEl.focus(); }
      if (e.key === 'Escape') showHub();
    });

    // ═══════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════
    renderHub();
  </script>
